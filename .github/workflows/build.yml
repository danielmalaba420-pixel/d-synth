name: Build D-SYNTH

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, v2 ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  VERSION: "2.0.0"

jobs:
  mac:
    name: macOS installer (.pkg, Apple Silicon + Intel)
    runs-on: macos-15
    permissions:
      contents: write
    env:
      HAS_CERTS: ${{ secrets.MAC_CERTS_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target DSynth_AU DSynth_VST3 DSynth_Standalone -- -quiet
      - name: Import Apple certificates (only if the secrets exist)
        env:
          CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        if: ${{ env.HAS_CERTS == 'true' }}
        run: |
          echo "$CERTS_P12" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Build the installer
        env:
          APP_SIGN_ID: ${{ secrets.MAC_APP_SIGN_ID }}
          INSTALLER_SIGN_ID: ${{ secrets.MAC_INSTALLER_SIGN_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          lipo -info build/DSynth_artefacts/Release/AU/D-SYNTH.component/Contents/MacOS/D-SYNTH
          ls -la build/DSynth_artefacts/Release build/DSynth_artefacts/Release/*
          packaging/mac/build_pkg.sh "$VERSION" build/DSynth_artefacts/Release dist Samples 2>&1 | tee pkg.log
          exit ${PIPESTATUS[0]}
      - name: Test the installer on this Mac
        run: |
          sudo installer -pkg "dist/D-SYNTH-$VERSION-Mac.pkg" -target /
          ls -d /Library/Audio/Plug-Ins/Components/D-SYNTH.component /Library/Audio/Plug-Ins/VST3/D-SYNTH.vst3 /Applications/D-SYNTH.app
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          ls "/Library/Application Support/Danova/D-SYNTH/Samples" | wc -l
          test -f "/Library/Application Support/Danova/D-SYNTH/Samples/samples.txt"
          auval -v aumu Dsyn Dnva | tail -4
      - name: Check the interface on macOS (snapshot of the real editor)
        continue-on-error: true
        run: |
          cmake -B snap -DDSYNTH_SNAPSHOT=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build snap --config Release --target DSynthSnapshot
          mkdir -p dist
          SNAP=$(find snap -name DSynthSnapshot -type f -perm -u+x | head -1)
          "$SNAP" dist/interface-mac.png 9
          "$SNAP" dist/interface-mac-accord.png 10 "48,52,55,60,64" NAPPE
          "$SNAP" --bank "/Library/Application Support/Danova/D-SYNTH/Samples" "/Library/Application Support/Danova/D-SYNTH/Samples" | tee dist/samples-check.txt
      - name: Send the log back if something failed
        if: failure()
        run: |
          mkdir -p ci && cp pkg.log ci/ 2>/dev/null || echo "no pkg.log" > ci/pkg.log
          cd ci && git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm log
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: D-SYNTH-Mac
          path: |
            dist/D-SYNTH-${{ env.VERSION }}-Mac.pkg
            dist/*.png
            dist/samples-check.txt

  windows:
    name: Windows installer (Setup.exe, 64-bit)
    # a commit message containing [mac-only] builds only the Mac installer (Dan tests the Mac first)
    if: ${{ !contains(github.event.head_commit.message, '[mac-only]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target DSynth_VST3 DSynth_Standalone
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $art = (Resolve-Path "build/DSynth_artefacts/Release").Path
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = (Resolve-Path "dist").Path
          $smp = (Resolve-Path "Samples").Path
          Push-Location packaging/windows
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DArtDir=$art" "/DSmpDir=$smp" "/DOutDir=$out" D-SYNTH.iss
          Pop-Location
          Get-ChildItem dist
      - name: Test the installer on this PC
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "dist\D-SYNTH-$env:VERSION-Windows-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          foreach ($f in @("C:\Program Files\Common Files\VST3\D-SYNTH.vst3\Contents\x86_64-win\D-SYNTH.vst3", "C:\Program Files\Danova\D-SYNTH\D-SYNTH.exe", "C:\ProgramData\Danova\D-SYNTH\Samples\samples.txt")) {
            if (-not (Test-Path $f)) { throw "Missing after install: $f" } else { Write-Host "OK $f" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: D-SYNTH-Windows
          path: dist/D-SYNTH-${{ env.VERSION }}-Windows-Setup.exe

  builds:
    name: Publier les installateurs (branche builds)
    needs: [ mac, windows ]
    if: always() && (needs.mac.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Push to builds branch
        run: |
          mkdir out
          find dist -type f \( -name '*.pkg' -o -name '*.exe' -o -name '*.png' -o -name '*.txt' \) -exec cp {} out/ \;
          cd out
          # GitHub refuses files over 100 MB: big installers are cut into 90 MB parts (join them with cat)
          for f in *.pkg *.exe; do
            [ -f "$f" ] || continue
            if [ $(stat -c %s "$f") -gt 95000000 ]; then split -b 90m "$f" "$f.part-" && sha256sum "$f" > "$f.sha256" && rm "$f"; fi
          done
          ls -la
          echo "Commit ${GITHUB_SHA}" > BUILD.txt
          git init -q
          git checkout -q -b builds
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Installers ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ mac, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.pkg
            dist/**/*.exe
