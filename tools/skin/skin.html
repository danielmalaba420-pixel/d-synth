<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Michroma';src:url(../../Assets/Michroma-Regular.ttf)}
@font-face{font-family:'Barlow Condensed';font-weight:500;src:url(../../Assets/BarlowCondensed-SemiBold.ttf)}
@font-face{font-family:'Barlow Condensed';font-weight:600;src:url(../../Assets/BarlowCondensed-SemiBold.ttf)}
@font-face{font-family:'Share Tech Mono';src:url(../../Assets/ShareTechMono-Regular.ttf)}
body{margin:0}
.wood{background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 28%,rgba(255,220,180,.07) 58%,rgba(0,0,0,.5)),repeating-linear-gradient(89deg,#4a2b17 0 3px,#5e3821 3px 7px,#432714 7px 9px,#6b4226 9px 15px,#50301b 15px 18px,#5a361f 18px 23px)}
.sc{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9d6cf,#8d8a84 45%,#3d3b38 100%);box-shadow:0 1px 2px rgba(0,0,0,.8),inset 0 -1px 1px rgba(0,0,0,.4);position:relative}
.sc::after{content:"";position:absolute;left:2px;right:2px;top:6px;height:2px;background:#2a2826;transform:rotate(38deg);border-radius:1px}
.led{width:8px;height:8px;border-radius:50%;margin:0 auto 7px;background:radial-gradient(circle at 40% 35%,#5a4220,#2a1c08);box-shadow:inset 0 1px 1px rgba(0,0,0,.8)}
.led.on{background:radial-gradient(circle at 40% 35%,#fff3d6,#FAC775 35%,#EF9F27 70%);box-shadow:0 0 10px 2px rgba(239,159,39,.55)}
.cb{position:relative;width:100%;height:40px;border-radius:6px;border:1px solid #070707;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:2px;color:#a39d92;background:linear-gradient(#404044,#242427 52%,#1a1a1c);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -3px 0 rgba(0,0,0,.45),0 5px 7px rgba(0,0,0,.65);overflow:hidden}
.cb::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:42%;border-radius:5px 5px 10px 10px;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0))}
.cb.on{color:#EF9F27;transform:translateY(2px);background:linear-gradient(#2e2e31,#1c1c1e 60%,#151517);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 2px 4px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.6)}
.nb{width:62px;height:54px;border-radius:8px;border:1px solid #070707;display:flex;align-items:center;justify-content:center;color:#d8d2c6;background:linear-gradient(#45454a,#26262a 55%,#1b1b1e);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.45),0 6px 9px rgba(0,0,0,.7);position:relative;overflow:hidden}
.nb::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:40%;border-radius:6px 6px 12px 12px;background:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,0))}
.lcd{position:relative;overflow:hidden;border-radius:6px;background:radial-gradient(ellipse at 55% 45%,#2c1b05,#140c02 75%,#0d0801)}
.lcd::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 30%,rgba(255,255,255,0) 31%),linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,0) 18%)}
.row{display:flex;justify-content:space-between;padding:4px 12px;font-family:'Share Tech Mono',monospace;font-size:15px;color:#9a6416;text-shadow:0 0 6px rgba(239,159,39,.35);white-space:pre}
.row.sel{background:#EF9F27;color:#1a1004;text-shadow:none;box-shadow:0 0 14px rgba(239,159,39,.45)}
.kn{position:relative;border-radius:50%;background:conic-gradient(#2a2a2d,#606065,#2a2a2d,#6e6e73,#2a2a2d,#56565b,#2a2a2d,#66666b,#2a2a2d);box-shadow:0 8px 12px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.12)}
.cap{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 34% 28%,#9c9ca2,#45454a 42%,#1d1d20 78%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.5)}
.ptr{position:absolute;inset:0}
.ptr::after{content:"";position:absolute;left:50%;top:9%;width:3px;height:24%;margin-left:-1.5px;border-radius:2px;background:#f3eee3;box-shadow:0 0 3px rgba(255,255,255,.5)}
.lab{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:3px;color:#a39d92;text-align:center}
.val{font-family:'Share Tech Mono',monospace;font-size:13px;color:#EF9F27;text-align:center;text-shadow:0 0 6px rgba(239,159,39,.5)}
.wk{position:relative;flex:1;height:100%;border-radius:0 0 7px 7px;margin-right:1px;background:linear-gradient(#ffffff,#f1eee6 70%,#dcd7cc);box-shadow:inset 0 -7px 0 #cdc7bb,inset 0 2px 3px rgba(0,0,0,.25),0 3px 4px rgba(0,0,0,.6)}
.bk{position:absolute;top:0;width:30px;height:62%;border-radius:0 0 5px 5px;background:linear-gradient(90deg,#0b0b0c,#2a2a2d 45%,#0b0b0c);box-shadow:inset 0 -6px 0 #000,inset 0 -8px 2px rgba(255,255,255,.08),0 4px 6px rgba(0,0,0,.7)}
.bk::after{content:"";position:absolute;left:7px;right:7px;top:4px;height:60%;border-radius:3px;background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.02))}
.wh{width:42px;height:150px;border-radius:7px;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0) 32%,rgba(0,0,0,0) 68%,rgba(0,0,0,.75)),repeating-linear-gradient(0deg,#2a2a2d 0 3px,#46464a 3px 5px);box-shadow:inset 0 0 0 1px #000}
.m-bg .dyn,.m-on .dyn{visibility:hidden}
.m-glass *{visibility:hidden}
.m-glass .lcd,.m-glass .lcd::before,.m-glass .lcd::after{visibility:visible}
.m-glass .lcd{background:none!important;border-color:transparent!important;box-shadow:none!important}
.m-glass .lcd::before,.m-glass .lcd::after{z-index:5}
html.m-glass,body.m-glass{background:transparent}
.ring{background:conic-gradient(from 225deg,#2a1d09 0deg,#2a1d09 270deg,rgba(0,0,0,0) 270deg)!important}
</style></head><body>
<div style="width:1320px;height:820px;display:flex;overflow:hidden;">
<div class="wood" style="width:46px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:18px 0;box-sizing:border-box;box-shadow:inset -3px 0 6px rgba(0,0,0,.6);"><div class="sc"></div><div class="sc"></div></div>
<div style="flex:1;position:relative;box-sizing:border-box;padding:20px 28px 22px;display:flex;flex-direction:column;gap:16px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,rgba(255,255,255,0) 1px 3px),linear-gradient(#1e1e21,#131315 38%,#0e0e10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);">
<div style="display:flex;align-items:center;justify-content:space-between;height:46px;">
<div style="display:flex;align-items:baseline;gap:18px;"><span style="font-family:'Michroma';font-size:32px;letter-spacing:9px;color:#ece6d9;text-shadow:0 2px 0 #000,0 -1px 0 rgba(255,255,255,.1);">D-SYNTH</span><span style="font-family:'Barlow Condensed';font-weight:500;font-size:14px;letter-spacing:3px;color:#8d877c;">CRÉÉ ET DÉVELOPPÉ PAR STUDIO DANOVA &amp; DANIEL MALABA</span></div>
<div style="display:flex;align-items:center;gap:14px;"><div data-id="bpmlcd" class="lcd" style="padding:7px 14px;border:1px solid #000;box-shadow:inset 0 2px 5px #000;"><span data-id="bpm" class="val dyn" style="font-size:14px;letter-spacing:2px;">SYNC ♩ 120 BPM</span></div><span style="font-family:'Michroma';font-size:12px;letter-spacing:3px;color:#1a1a1c;background:linear-gradient(#d9d4c8,#a9a398);padding:6px 12px;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 4px rgba(0,0,0,.6);">V2.0</span></div>
</div>
<div style="display:flex;align-items:flex-end;gap:10px;"><span class="lab" style="width:110px;text-align:left;padding-bottom:12px;color:#6f6a61;">CATÉGORIE</span>{{CATS}}</div>
<div style="display:flex;gap:22px;height:262px;">
<div style="flex:1;padding:11px;border-radius:12px;background:linear-gradient(#050505,#121213);box-shadow:inset 0 4px 10px #000,0 1px 0 rgba(255,255,255,.08);"><div data-id="screen" class="lcd" style="height:100%;display:flex;">
<div data-id="list" style="width:44%;padding:10px 0;border-right:1px solid rgba(239,159,39,.18);position:relative;z-index:1;"><div class="dyn">{{ROWS}}</div></div>
<div data-id="info" style="flex:1;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1;">
<div style="display:flex;justify-content:space-between;"><span data-id="tag" class="val dyn" style="font-size:14px;letter-spacing:4px;color:#b07419;">NAPPE</span><span data-id="num" class="val dyn" style="font-size:14px;letter-spacing:2px;color:#b07419;">10 / 20</span></div>
<div><div data-id="name" class="dyn" style="font-family:'Share Tech Mono';font-size:46px;letter-spacing:2px;color:#FAC775;text-shadow:0 0 10px rgba(239,159,39,.7),0 0 24px rgba(239,159,39,.35);">STRING GLIDE</div><div data-id="desc" class="val dyn" style="font-size:15px;color:#c58520;margin-top:6px;text-align:left">Cordes synthé avec glide d'accords</div></div>
<div style="display:flex;justify-content:space-between;"><span data-id="left" class="val dyn" style="color:#b07419;">BUILD 62%</span><span data-id="right" class="val dyn" style="color:#b07419;">POLY 16</span></div>
</div></div></div>
<div style="width:72px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6px 0;">
<div class="nb" data-id="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg></div>
<div class="nb" data-id="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a39d92" stroke-width="1.8"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></div>
<div class="nb" data-id="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"></path></svg></div>
</div>
<div style="width:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
<div data-id="build" class="ringwrap" style="width:200px;height:200px;border-radius:50%;position:relative;background:conic-gradient(from 225deg,#EF9F27 0deg,#FAC775 168deg,#2a1d09 168deg,#2a1d09 270deg,rgba(0,0,0,0) 270deg);box-shadow:0 0 18px rgba(239,159,39,.25);">
<div style="position:absolute;inset:9px;border-radius:50%;background:#111113;box-shadow:inset 0 3px 8px #000;"></div>
<div class="kn" data-id="buildknob" style="position:absolute;inset:26px;"><div class="cap"></div><div class="ptr dyn" style="transform:rotate(33deg);"></div></div></div>
<span style="font-family:'Michroma';font-size:18px;letter-spacing:7px;color:#ece6d9;">BUILD</span></div>
</div>
<div style="display:flex;justify-content:space-between;padding:0 24px;height:120px;align-items:center;">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div class="kn" data-id="knob" style="width:70px;height:70px;"><div class="cap"></div><div class="ptr dyn" style="transform:rotate(-60deg);"></div></div><span class="lab dyn" data-id="klab">GLIDE</span><span class="val dyn" data-id="kval">180 MS</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div class="kn" data-id="knob" style="width:70px;height:70px;"><div class="cap"></div><div class="ptr dyn" style="transform:rotate(20deg);"></div></div><span class="lab dyn" data-id="klab">TONE</span><span class="val dyn" data-id="kval">58%</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div class="kn" data-id="knob" style="width:70px;height:70px;"><div class="cap"></div><div class="ptr dyn" style="transform:rotate(-10deg);"></div></div><span class="lab dyn" data-id="klab">DELAY</span><span class="val dyn" data-id="kval">1/8 · 44%</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div class="kn" data-id="knob" style="width:70px;height:70px;"><div class="cap"></div><div class="ptr dyn" style="transform:rotate(45deg);"></div></div><span class="lab dyn" data-id="klab">REVERB</span><span class="val dyn" data-id="kval">66%</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div class="kn" data-id="knob" style="width:70px;height:70px;"><div class="cap"></div><div class="ptr dyn" style="transform:rotate(80deg);"></div></div><span class="lab dyn" data-id="klab">WIDTH</span><span class="val dyn" data-id="kval">82%</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div class="kn" data-id="knob" style="width:70px;height:70px;"><div class="cap"></div><div class="ptr dyn" style="transform:rotate(0deg);"></div></div><span class="lab dyn" data-id="klab">VOLUME</span><span class="val dyn" data-id="kval">0.0 DB</span></div>
</div>
<div style="display:flex;gap:18px;flex:1;min-height:0;">
<div style="width:132px;display:flex;gap:14px;justify-content:center;align-items:flex-end;padding:10px;box-sizing:border-box;border-radius:10px;background:#0a0a0b;box-shadow:inset 0 3px 8px #000,0 1px 0 rgba(255,255,255,.07);">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="wh" data-id="wheel"></div><span class="lab" style="font-size:12px;">PITCH</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="wh" data-id="wheel" style="position:relative;"><div class="dyn" style="position:absolute;left:4px;right:4px;top:92px;height:3px;background:#EF9F27;box-shadow:0 0 6px #EF9F27;"></div></div><span class="lab" style="font-size:12px;">MOD</span></div></div>
<div style="flex:1;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;background:#070707;padding:0 6px 6px;box-shadow:inset 0 3px 8px #000;">
<div style="height:8px;background:linear-gradient(#5c1116,#3a0a0e);box-shadow:inset 0 -2px 2px rgba(0,0,0,.6);"></div>
<div data-id="keys" style="flex:1;position:relative;display:flex;padding-top:2px;">{{WHITES}}{{BLACKS}}</div></div>
</div>
<div class="sc" style="position:absolute;top:10px;left:10px;width:10px;height:10px;"></div><div class="sc" style="position:absolute;top:10px;right:10px;width:10px;height:10px;"></div>
</div>
<div class="wood" style="width:46px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:18px 0;box-sizing:border-box;box-shadow:inset 3px 0 6px rgba(0,0,0,.6);"><div class="sc"></div><div class="sc"></div></div>
</div></body></html>
